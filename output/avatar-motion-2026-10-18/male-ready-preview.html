<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ต้นแบบอวตารชายและหญิง · Secret Council</title>
<style>
:root{color:#102735;background:#f2ebdd;font-family:Tahoma,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:680px;margin:auto;padding:24px;background:#fff9ee;border:1px solid #c9bba6;border-radius:14px}h1{font-family:Georgia,serif;font-size:25px;margin:0 0 12px}p{line-height:1.65}.stage{position:relative;width:min(100%,362px);aspect-ratio:1;margin:24px auto 8px;isolation:isolate}.avatar{position:absolute;inset:0;background-image:url('male-ready-sprite-draft.png');background-size:400% 300%;background-repeat:no-repeat}.table{position:absolute;z-index:1;bottom:-2px;left:-4%;width:108%;height:21px;background:#987447;border:4px solid #3b3028;border-bottom-width:7px;border-radius:50% 50% 4px 4px;box-shadow:0 4px 0 #d2aa68}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}button{font:inherit;font-weight:700;border:1px solid #274253;background:#fff9ee;color:#102735;border-radius:8px;min-height:46px;padding:10px 20px;cursor:pointer}button:first-child{background:#274253;color:#fff9ee}button:focus-visible{outline:3px solid #3e918a;outline-offset:3px}.status{text-align:center;font-size:14px;min-height:24px;color:#274253}.note{font-size:13px;border-top:1px solid #c9bba6;padding-top:16px;color:#274253}@media(max-width:420px){body{padding:12px}main{padding:16px}.stage{margin-top:12px}}
</style>
<style>button[aria-pressed="true"]{background:#274253;color:#fff9ee}button[aria-pressed="false"]{background:#fff9ee;color:#102735}</style>
<main>
<h1>ต้นแบบอวตารชายและหญิง</h1>
<p>ลายเส้นแบบการ์ด · ใบหน้าในเงา · ทดสอบเปลี่ยนท่า 12 เฟรม</p>
<div class="controls" role="group" aria-label="เลือกตัวละคร"><button id="male" type="button" aria-pressed="true">ชาย</button><button id="female" type="button" aria-pressed="false">หญิง</button></div>
<div class="stage" aria-hidden="true"><div class="avatar" id="avatar"></div><div class="table"></div></div>
<div class="controls"><button id="ready" type="button">พร้อมเล่น</button><button id="relax" type="button">ยกเลิกความพร้อม</button></div>
<p class="status" id="status" role="status">ยังไม่พร้อม · เฟรม 1/12</p>
<p class="note">แบบร่างสำหรับตรวจสไตล์และการเคลื่อนไหว ยังไม่ได้แทนอวตารในเกมจริง เฟรมจากภาพสร้างอาจมีการขยับของรายละเอียดที่ต้องปรับก่อนใช้งานจริง หากตั้งค่าลดการเคลื่อนไหว จะแสดงท่าปลายทางทันที</p>
</main>
<script>
const avatar=document.querySelector('#avatar'),status=document.querySelector('#status');
const male=document.querySelector('#male'),female=document.querySelector('#female');
let frame=0,target=0,timer=null;
function draw(){avatar.style.backgroundPosition=`${frame%4*100/3}% ${Math.floor(frame/4)*50}%`;status.textContent=`${target===11?'พร้อมเล่น':'ยังไม่พร้อม'} · เฟรม ${frame+1}/12`;}
function move(next){target=next;clearInterval(timer);if(matchMedia('(prefers-reduced-motion: reduce)').matches){frame=target;draw();return;}draw();timer=setInterval(()=>{if(frame===target){clearInterval(timer);return;}frame+=Math.sign(target-frame);draw();},1000/24);}
document.querySelector('#ready').addEventListener('click',()=>move(11));
document.querySelector('#relax').addEventListener('click',()=>move(0));
function selectCharacter(gender){clearInterval(timer);frame=target=0;avatar.style.backgroundImage=`url('${gender}-ready-sprite-draft.png')`;male.setAttribute('aria-pressed',String(gender==='male'));female.setAttribute('aria-pressed',String(gender==='female'));history.replaceState(null,'',`?character=${gender}`);draw();}
male.addEventListener('click',()=>selectCharacter('male'));
female.addEventListener('click',()=>selectCharacter('female'));
selectCharacter(new URLSearchParams(location.search).get('character')==='female'?'female':'male');
</script>
</html>
